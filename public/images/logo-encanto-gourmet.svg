  <!-- Text "BRIGADEIRIA" -->
  <text x="500" y="560" font-family="'Montserrat', 'Cinzel', 'Trajan Pro', sans-serif, serif" font-size="34" font-weight="400" fill="#D4AF37" letter-spacing="18" text-anchor="middle">
